<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Varstvo ljubljenčkov | Kontakt</title>
    <link rel="stylesheet" href="obl.css">
</head>
<body>
    <header class="glava">
        <h1>Kontakt in rezervacija</h1>
        <p>Veselimo se srečanja z vami in vašim ljubljenčkom!</p>
    </header>

    <nav class="navigacija">
        <ul>
            <li><a href="index.html">Domov</a></li>
            <li><a href="storitve.html">Naše storitve</a></li>
            <li><a href="kontakt.html" aria-current="page">Kontakt</a></li>
        </ul>
    </nav>

    <main class="vsebina">
        <section class="stolpci">
            <article class="kartica">
                <h2>Kontaktni podatki</h2>
                <p><strong>E-pošta:</strong>
                    <a href="mailto:info@example.com">info@example.com</a>
                </p>
                <p><strong>Telefon:</strong> 040 010 010</p>
                <p><strong>Lokacija:</strong> Novo mesto in okolica</p>
                <p>Oglejte si naš <a href="storitve.html#cenik">cenik</a>.</p>
            </article>

            <article class="kartica">
                <h2>Pošljite povpraševanje</h2>

                <form id="kontaktObrazec">

                    <div class="izpolni">
                        <label for="ime">Ime in priimek:</label>
                        <input id="ime" name="Ime in priimek"
                               placeholder="Vaše ime" required>
                    </div>

                    <div class="izpolni">
                        <label for="email">E-poštni naslov:</label>
                        <input id="email" name="E-pošta"
                               type="email"
                               placeholder="ime@example.com" required>
                    </div>

                    <div class="izpolni">
                        <label for="zival">Vrsta živali:</label>
                        <select id="zival" name="Vrsta živali" required>
                            <option value="">Izberite žival</option>
                            <option>Pes</option>
                            <option>Mačka</option>
                            <option>Druga žival</option>
                        </select>
                    </div>

                    <div class="izpolni">
                        <label for="datum">Želeni datum varstva:</label>
                        <input id="datum" name="Datum varstva"
                               type="date" required>
                    </div>

                    <div class="izpolni">
                        <label for="storitev">Želena storitev:</label>
                        <select id="storitev" name="Želena storitev" required>
                            <option value="">Izberite storitev</option>
                            <option>Sprehajanje psa</option>
                            <option>Varstvo na domu</option>
                            <option>Dnevno varstvo</option>
                            <option>Obisk mačke</option>
                        </select>
                    </div>

                    <div class="izpolni">
                        <label for="sporocilo">Dodatne informacije:</label>
                        <textarea id="sporocilo" name="Dodatne informacije"
                                  rows="4"></textarea>
                    </div>

                    <button type="submit" class="gumb">
                        Oddaj povpraševanje
                    </button>
                    <p id="obrazecRezultat" aria-live="polite"></p>
                </form>
            </article>
        </section>
    </main>

    <footer class="noga">
        <p>2026 Varstvo ljubljenčkov</p>
    </footer>
    <script src="skr.js"></script>
</body>
</html>
